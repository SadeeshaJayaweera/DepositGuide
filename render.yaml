services:
  - type: web
    name: depositguide-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: depositguide-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: depositguide-db
    databaseName: depositguide
    user: depositguide_user
    plan: free
